<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="Google Sans, Roboto, Hiragino Sans, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EA4335"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3c4043" flood-opacity="0.18"/></filter>
    <style>
      .card{fill:#fff;filter:url(#sh)}
      .t{font-size:22px;font-weight:600;fill:#202124}
      .s{font-size:16px;fill:#5f6368}
      .e{stroke:#5f6368;stroke-width:2;fill:none;marker-end:url(#a)}
      .d{stroke:#EA4335;stroke-width:2;fill:none;marker-end:url(#b);stroke-dasharray:6 5}
      .lb{font-size:15px;fill:#5f6368}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8f9fa"/>
  <rect x="0" y="0" width="1600" height="6" fill="#4285F4"/><rect x="400" y="0" width="400" height="6" fill="#EA4335"/><rect x="800" y="0" width="400" height="6" fill="#FBBC04"/><rect x="1200" y="0" width="400" height="6" fill="#34A853"/>
  <text x="60" y="68" font-size="34" font-weight="600" fill="#202124">Agent Calendar — アーキテクチャ</text>
  <text x="60" y="102" class="s">予定と締切を Google Calendar に書くと、agent が準備と定期の仕事を自分で始める</text>

  <!-- 人 -->
  <rect x="60" y="150" width="300" height="130" rx="12" class="card"/>
  <text x="84" y="192" class="t">人（本人・審査員）</text>
  <text x="84" y="224" class="s">カレンダーに予定を書く</text>
  <text x="84" y="250" class="s">dashboard で記録を見て承認する</text>

  <!-- Calendar -->
  <rect x="60" y="340" width="300" height="440" rx="12" class="card"/>
  <image href="icons/google_calendar.svg" x="84" y="362" width="36" height="36"/>
  <text x="132" y="388" class="t">Google Calendar</text>
  <rect x="84" y="420" width="252" height="150" rx="10" fill="#e8f0fe"/>
  <rect x="84" y="420" width="6" height="150" fill="#4285F4"/>
  <text x="104" y="456" font-size="19" font-weight="600" fill="#202124">起動用カレンダー</text>
  <text x="104" y="486" class="s">頼みたい仕事を</text>
  <text x="104" y="510" class="s">自然言語で書く</text>
  <text x="104" y="540" class="s" fill="#1a73e8">= 命令（作成者 allowlist）</text>
  <rect x="84" y="595" width="252" height="160" rx="10" fill="#f1f3f4"/>
  <rect x="84" y="595" width="6" height="160" fill="#9aa0a6"/>
  <text x="104" y="631" font-size="19" font-weight="600" fill="#202124">記録用カレンダー</text>
  <text x="104" y="661" class="s">締切 +「準備: 30日前」</text>
  <text x="104" y="687" class="s">= 事実。notes は</text>
  <text x="104" y="713" class="s">信頼しないデータ</text>

  <!-- GCP frame -->
  <rect x="440" y="140" width="1110" height="700" rx="16" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
  <rect x="440" y="140" width="1110" height="44" rx="16" fill="#f1f3f4"/>
  <rect x="440" y="168" width="1110" height="16" fill="#f1f3f4"/>
  <text x="466" y="169" font-size="17" font-weight="600" fill="#3c4043">Google Cloud</text>

  <!-- Scheduler -->
  <rect x="470" y="215" width="290" height="120" rx="12" class="card"/>
  <image href="icons/cloud_scheduler.svg" x="490" y="235" width="40" height="40"/>
  <text x="542" y="262" class="t">Cloud Scheduler</text>
  <text x="490" y="300" class="s">1分ごとに /tick（OIDC）</text>

  <!-- Cloud Run -->
  <rect x="840" y="215" width="680" height="410" rx="12" class="card"/>
  <image href="icons/cloud_run.svg" x="862" y="235" width="40" height="40"/>
  <text x="914" y="262" class="t">Cloud Run — runner（Bun + TypeScript）</text>
  <rect x="862" y="295" width="310" height="150" rx="10" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="882" y="328" font-size="18" font-weight="600" fill="#202124">/tick</text>
  <text x="882" y="356" class="s">syncToken で差分を取得</text>
  <text x="882" y="380" class="s">LLM で実行先と内容を判定</text>
  <text x="882" y="404" class="s">発火予定の計算・予約</text>
  <text x="882" y="428" class="s">同じ回は一度だけ</text>
  <rect x="1188" y="295" width="310" height="150" rx="10" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="1208" y="328" font-size="18" font-weight="600" fill="#202124">agent 実行（準備）</text>
  <text x="1208" y="356" class="s">tool は allowlist</text>
  <text x="1208" y="380" class="s">読み取り + 提案だけ</text>
  <text x="1208" y="404" class="s">notes は &lt;untrusted&gt;</text>
  <rect x="862" y="460" width="636" height="145" rx="10" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="882" y="493" font-size="18" font-weight="600" fill="#202124">dashboard</text>
  <text x="882" y="521" class="s">週表示のカレンダー / セッション（入力・tool・出力）/ 承認待ち</text>
  <text x="882" y="547" class="s">デモ用フォーム: レート制限・文字数上限・自動削除</text>
  <text x="882" y="573" class="s">承認したときだけ記録用カレンダーに書く</text>

  <!-- Logging -->
  <rect x="470" y="420" width="290" height="140" rx="12" class="card"/>
  <image href="icons/cloud_logging.svg" x="490" y="440" width="40" height="40"/>
  <text x="542" y="467" class="t">Cloud Logging</text>
  <text x="490" y="505" class="s">構造化ログ</text>
  <text x="490" y="529" class="s">同期・発火・tool・token 使用量</text>

  <!-- bottom row -->
  <rect x="470" y="680" width="330" height="130" rx="12" class="card"/>
  <image href="icons/firestore.svg" x="490" y="700" width="40" height="40"/>
  <text x="542" y="727" class="t">Firestore</text>
  <text x="490" y="765" class="s">予定・発火予定・判定結果</text>
  <text x="490" y="789" class="s">実行記録・承認待ち・token</text>

  <rect x="860" y="680" width="310" height="130" rx="12" class="card"/>
  <image href="icons/vertexai.svg" x="880" y="700" width="40" height="40"/>
  <text x="932" y="727" class="t">Vertex AI</text>
  <text x="880" y="765" class="s">Gemini 2.5 Flash</text>
  <text x="880" y="789" class="s">service account・API key なし</text>

  <rect x="1210" y="680" width="310" height="130" rx="12" class="card"/>
  <image href="icons/cloud_run.svg" x="1230" y="700" width="40" height="40"/>
  <text x="1282" y="727" class="t">Cloud Run Job</text>
  <text x="1230" y="765" class="s">実行ごとの sandbox</text>
  <text x="1230" y="789" class="s">権限なし・LLM は proxy 経由</text>

  <!-- edges -->
  <path class="e" d="M360 190 H 400 V 120 H 1180 V 210"/>
  <text x="760" y="112" class="lb">閲覧・承認・予定の追加</text>
  <path class="e" d="M210 280 V 336"/>
  <path class="e" d="M760 275 H 836"/>
  <path class="e" d="M336 495 C 420 495, 420 380, 836 380"/>
  <text x="470" y="372" class="lb">service account で差分を読む</text>
  <path class="d" d="M862 590 H 820 V 650 H 400 V 680 H 340"/>
  <text x="560" y="642" class="lb" fill="#d93025">承認したときだけ書く</text>
  <path class="e" d="M960 625 L 760 676"/>
  <path class="e" d="M1015 625 L 1015 676"/>
  <path class="e" d="M1365 625 L 1365 676"/>
  <path class="e" d="M862 520 L 764 500"/>
</svg>
